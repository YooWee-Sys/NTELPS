<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header class="review-page">
<h1>Review Page</h1>
    </header> 
  

<section class="notes-container">
    <h2>My Study Notes</h2>

   
    <input
        type="text"
        id="note-title"
        placeholder="Enter your note title..."
        required
    >

    <textarea
        id="student-notes"
        placeholder="Type or paste your class notes here..."
        required
    ></textarea>




    <button id="save-notes">Save Notes</button>
    <p id="notes-message" class="error-message"></p>

    <a href="savednotes.html" id="see-saved-notes">View Saved Notes</a>

</section>

 <script src="script.js"></script>
</body>
</html>
