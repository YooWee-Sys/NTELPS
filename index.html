
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTELPS - Student Login</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <h1>Next-Generation Tech-Enhanced Learning Platform for Students</h1>

    <section id="Baby">
        <div class="login-box">

            <div class="login-header">
                <header>STUDENT LOG IN</header>
            </div>

            <form id="login-form">
                <div class="input-box">

                    <input
                        type="text"
                        id="student-name"
                        name="studentName"
                        class="input-field"
                        placeholder="Student Name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                    <input
                        type="text"
                        id="student-id"
                        name="schoolId"
                        class="input-field"
                        placeholder="School ID"
                        autocomplete="off"
                        maxlength="50"
                        required
                    >

                </div>

                <div class="input-submit">
                    <button type="submit" class="submit-btn">
                        Login
                    </button>
                </div>

                <p
                    id="message"
                    class="error-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

        </div>
    </section>

    <script src="login-auth.js"></script>
</body>
</html>
