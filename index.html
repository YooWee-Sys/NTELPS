
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Generation Learning Platform</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <h1>Next-Generation Tech-Enhanced Learning Platform for Students</h1>

    <section id="Baby">
        <div class="login-box">

            <div class="login-header">
                <header>STUDENT LOG IN</header>
            </div>

            <form id="login-form">
                <div class="input-box">
                    <input
                        type="text"
                        id="student-name"
                        class="input-field"
                        placeholder="Student Name"
                        autocomplete="name"
                        required
                    >
<section id="Jack">
                    <input
                        type="text";
                        id="student-id"
                        class="input-field"
                        placeholder="Student ID"
                        required
                        inputmode="numeric"> 
</section>
                </div>
<section id="Jill">
                <div class="input-submit">
                    <button type="submit" class="submit-btn">
                        Login
                    </button>
                    </section>
                    <p id="message" class="error-message"></p>
                </div> 
            </form>

            <p id="message"></p>

        </div>
    </section>
   <script src="script.js"></script>
</body>
</html>
